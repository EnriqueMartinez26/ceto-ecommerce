spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

ceto:
  orders:
    reservation-hours: ${ORDER_RESERVATION_HOURS:48}
    max-units-per-line: ${ORDER_MAX_UNITS_PER_LINE:10}
    max-lines-per-order: 20
    expiry:
      batch-size: 100
      fixed-delay-ms: 60000
