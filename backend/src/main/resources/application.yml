server:
  # The container resolves the client address (RemoteIpValve), the application only reads getRemoteAddr().
  # The "framework" strategy must not be used here (REQ-ABU-03). Only peers matching internal-proxies are believed.
  forward-headers-strategy: native
  tomcat:
    # Bodies Tomcat handles by itself, outside the application byte counter (BodySizeLimitFilter): the unread body it
    # swallows to reuse a connection, and form parameters (getParameter). No route consumes a form, so the form limit
    # is tied to the application body limit.
    max-swallow-size: 64KB
    max-http-form-post-size: ${ceto.web.max-body-bytes}B
    remoteip:
      remote-ip-header: X-Forwarded-For
      internal-proxies: "${ceto.web.trusted-proxies}"
      # Boot passes X-Forwarded-Host, X-Forwarded-Port and "https" to the valve unless they are set to empty here, and
      # a trusted peer could then rewrite the host and port of absolute URLs. WebConfig refuses to start otherwise.
      host-header: ""
      port-header: ""
      protocol-header-https-value: ""
  servlet:
    session:
      # The administration session cookie (REQ-AUTH-04): never readable by scripts, never sent over plain HTTP, never sent
      # cross-site, and the id travels only in the cookie (no URL rewriting). Pinned by the real-server ITs, and AdminSessionGuard
      # refuses to start with any other value, in every profile.
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: strict
  error:
    # Errors raised outside Spring MVC render through Boot's /error (D-20261007-23): never expose details.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    # Every log line of a request carries its server-generated id (RequestIdFilter puts it in the MDC).
    level: "%5p [rid:%X{requestId:-}]"
  level:
    # Hibernate 7 logs SQL errors under these categories; a Postgres CHECK violation's DETAIL is the whole row
    # (name, phone, address). Silencing SqlExceptionHelper does nothing in Hibernate 7 (verification U-8).
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.orm.jdbc.warn: "OFF"
    # Spring MVC logs the exception message of malformed requests, and that message echoes the rejected value.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: "OFF"
    org.springframework.web.servlet.PageNotFound: "OFF"
    # DaoAuthenticationProvider logs "Failed to find user '<username>'" at DEBUG, and the username is whatever the client
    # typed. Silenced on its own category so a broader org.springframework.security DEBUG cannot print it.
    org.springframework.security.authentication.dao: "OFF"

spring:
  datasource:
    hikari:
      # Resource exhaustion limits (REQ-HRD, carry-forward S5c). The pool is bounded and a request waits at most 3 s for
      # a connection before the advice answers 503 SERVICE_BUSY. 10 connections stay under the Tomcat default of 200
      # threads on purpose: threads past the pool queue on the pool for 3 s and are then shed, they never pile up on
      # the database (Postgres allows 100 connections, one JVM uses at most 10).
      maximum-pool-size: 10
      connection-timeout: 3000
      # Every connection of the pool, including the one Flyway borrows at startup (it uses this same DataSource), waits
      # at most 5 s for any lock (rows, advisory locks: verification U-7, U-12) and then fails with SQLState 55P03,
      # which becomes 503 SERVICE_BUSY. The per-phone checkout lock does not wait at all (pg_try_advisory_xact_lock: a
      # second checkout of the same phone gets 503 at once, D-20261008-01), so waiters never pin pooled connections.
      # Migrations take no long-held locks on a quiet database; a migration blocked for 5 s should fail the deploy, not
      # hang it. idle_in_transaction_session_timeout is the backstop for a transaction that holds locks (the phone lock
      # lives until commit) but stopped talking to the database: Postgres ends that session after 30 s.
      connection-init-sql: "SET lock_timeout = '5s'; SET idle_in_transaction_session_timeout = '30s'"
  servlet:
    multipart:
      # No route reads a multipart body: the container is not configured to parse one (and the login guard answers 415).
      enabled: false
  # The API serves no static files; unknown paths end in the standard 404 problem body.
  web:
    resources:
      add-mappings: false
  # The advice owns every error body (ApiExceptionHandler); Boot's ProblemDetail handler must not compete.
  mvc:
    problemdetails:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

ceto:
  orders:
    reservation-hours: ${ORDER_RESERVATION_HOURS:48}
    max-units-per-line: ${ORDER_MAX_UNITS_PER_LINE:30}
    max-lines-per-order: 20
    max-pending-per-phone: ${ORDER_MAX_PENDING_PER_PHONE:3}
    expiry:
      batch-size: 100
      fixed-delay-ms: 60000
      max-batches-per-tick: 10
  admin:
    # The one administrator account. REQUIRED, no default: unset stops the startup (the placeholders do not resolve),
    # and a blank value or a hash that is not a {bcrypt} hash of cost 10..14 is rejected by AdminCredentials with a fixed
    # message that never echoes the value. No real credential or hash is ever committed (NoCommittedHashTest); the hash
    # is produced with the provisioning command and `$` is written `$$` in compose files.
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
    # Idle time after which an admin session ends (AdminProperties: 5..1440).
    session-idle-timeout-minutes: ${ADMIN_SESSION_IDLE_MINUTES:480}
    # Longest life of a session from its login, however active it is (AdminProperties: 60..1440; 12 h by default).
    session-absolute-timeout-minutes: ${ADMIN_SESSION_ABSOLUTE_MINUTES:720}
    # POST /api/admin/login: 5 attempts at once, then one more every 90 seconds (40 per hour). Bounds in AdminProperties.
    login-rate-limit:
      burst: 5
      refill-interval-seconds: 90
      max-tracked-clients: 10000
      # When the table is full, every new client shares ONE overflow bucket.
      overflow-burst: 20
      overflow-refill-per-hour: 40
      # BCrypt verifications allowed at the same time (CPU cap, 1..8). The attempt that finds them all busy for 200 ms
      # gets a 503 SERVICE_BUSY and costs no hash (D-20261008-45).
      max-concurrent-verifications: 2
    # Largest admin product list and stock view (AdminProperties: 1..500).
    max-listed-products: 200
    # Largest reconciliation result (AdminProperties: 1..1000).
    max-reconciliation-rows: 100
  web:
    # Largest request body in bytes (BodySizeLimitFilter): 16 KiB is far above a 50-line order. WebProperties: 1024..262144.
    max-body-bytes: 16384
    # Largest storefront list (WebProperties: 1..500).
    storefront-max-products: 200
    # Peers allowed to set the client address through X-Forwarded-For. Tomcat reads internal-proxies as a CIDR list when
    # it contains "/", otherwise as one full-match regex; THIS APPLICATION REJECTS THE REGEX FORM and accepts only CIDR
    # entries inside the private blocks. Trusting 127.0.0.0/8 or 169.254.0.0/16 trusts every process of the host or
    # every neighbour on the link, not just the proxy: prefer a /32. REQUIRED, no default: unset stops the startup, and
    # a value that would trust a public address is rejected by WebProperties (D-20261007-17, verification U-6).
    trusted-proxies: ${TRUSTED_PROXIES}
    # POST /api/checkout/orders: 10 attempts at once, then one more every 6 minutes (10 per hour).
    checkout-rate-limit:
      burst: 10
      refill-interval-seconds: 360
      max-tracked-clients: 10000
      # When the table is full, every new client shares ONE overflow bucket with its own, larger budget (D-20261007-25).
      overflow-burst: 100
      overflow-refill-per-hour: 100
